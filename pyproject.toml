[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/vtx_crs"]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project]
name = "vtx-crs-agent"
version = "0.1.0"
description = "Autonomous Cyber Reasoning System (CRS) built on vtx-coding-agent. Reads unknown codebases, discovers and explains security vulnerabilities, generates and applies secure patches, builds, runs regression tests, validates fixes, and produces professional reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79.0",
    "httpx>=0.27.0",
    "openai>=2.21.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
    "textual>=8.0.0",
    "vtx-coding-agent",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]

[project.scripts]
vtx-crs = "vtx_crs.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"src/vtx_crs/prompts/identity.py" = ["E501"]
"src/vtx_crs/tools/crs/**/*.py" = ["E501", "B905", "F541", "E741", "F821", "F401"]
"tests/*.py" = ["W293"]  # trailing whitespace inside unified-diff fixture strings

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
